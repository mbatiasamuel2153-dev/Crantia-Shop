 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Form</title>
  <style>
    body {
      background: linear-gradient(to left, purple, rgb(254, 68, 254));
    }
    .finly {
      width: 190px;
      height: 40px;
      margin-top: 40px;
      margin-left: 45%;
      font-weight: bold;
      background-color: rgb(255, 255, 0);
      border-radius: 15px;
      cursor: pointer;
    }
    .cont {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      margin-top: 50px;
    }
    .in {
      border-radius: 11px;
      height: 30px;
      border: 2px solid aqua;
      padding: 5px;
    }
  </style>
</head>
<body>

  <form action="https://formspree.io/f/xlgdqrqq" method="POST">
    <div class="cont">
      <input type="text" name="name" placeholder="ENTER YOUR NAME" class="in" required>
      <input type="tel" name="phone" placeholder="Enter phone No" class="in" required>
        <input type="email" name="email" placeholder="Enter phone No" class="in" required>
    </div>
    <button type="submit" class="finly">PLACE ORDER</button>
  </form>
  
      
</body>

</html>
